name: CI

on: [push, pull_request, workflow_dispatch]

env:
  # 救 CI 全部步骤的编码面：不加 -X utf8 的 python 进程（如 pytest）也拿 UTF-8
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  # 本机实测：pyc 偶发损坏会造出随机失败，CI 一律不写 pyc
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.8" }
          - { os: windows-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
        with:
          # 行尾守门需读工作树；历史扫描类守门若将来引入则需 fetch-depth: 0
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 安装面 = README 快速开始那条命令的 extras 集合，两边必须一致。
      # [pdf] 是测试期依赖：输入层门禁用真实 PDF 夹具驱动（M6 干净环境实测，
      # 缺它则 22 条 PDF 通路测试硬失败）——pdfplumber 纯 Python 无编译依赖。
      - name: Install (README extras set)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,pdf]"

      - name: Run test suite
        run: python -m pytest

      # 通路①：裸 console script（README 让用户敲的那条）
      - name: Smoke (console script)
        run: checkup-ledger selftest

      # 通路②：模块形式（sys.path 来源与通路①不同，一种通不等于另一种通）
      - name: Smoke (python -m)
        run: python -m checkup_ledger selftest

      - name: Smoke (indicators + bench)
        run: |
          checkup-ledger indicators
          checkup-ledger bench

      # 可证伪探活：注入缺陷后基准必须报未达标（退出码 1）
      - name: Bench probe must fail as designed
        shell: bash
        run: |
          set +e
          checkup-ledger bench --probe-fault
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "探活失败：--probe-fault 应退出 1（未达标），实得 $code —— 基准可能空转"
            exit 1
          fi
          echo "探活通过：基准确实可证伪（退出码 1）"

      - name: Usage error must exit 2
        shell: bash
        run: |
          set +e
          checkup-ledger no-such-command >/dev/null 2>&1
          code=$?
          if [ "$code" -ne 2 ]; then
            echo "用法错误应退出 2，实得 $code"
            exit 1
          fi
          echo "用法错误退出码正确（2）"

      - name: PII gate selftest
        run: python tools/pii_gate.py --selftest

  # M5 实构建档（真跑 PyInstaller + 真扫产物归档 + 中立目录真跑产物）：
  # M6 起进 CI——这是"零上传可扫断言"与"内嵌数据对账"在远端环境的唯一实证。
  # 与 test job 分开：多一次 PyInstaller 安装与构建（约 1–2 分钟），且矩阵只取
  # windows/3.12（本机同通道实测过的组合；Linux 冻结产物未被本项目承诺）。
  freeze:
    name: freeze-build / py3.12 (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (dev + freeze)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,freeze]"

      - name: Frozen-build tier (real build + scan + neutral smoke)
        env:
          CHECKUP_LEDGER_FREEZE_BUILD: "1"
        run: python -m pytest tests/test_frozen.py
