name: CI

on: [push, pull_request, workflow_dispatch]

env:
  # 救 CI 全部步骤的编码面：不加 -X utf8 的 python 进程（如 pytest）也拿 UTF-8
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  # 本机实测：pyc 偶发损坏会造出随机失败，CI 一律不写 pyc
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.8" }
          - { os: windows-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
        with:
          # 行尾守门需读工作树；历史扫描类守门若将来引入则需 fetch-depth: 0
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 安装面 = README 快速开始那条命令的 extras 集合，两边必须一致
      - name: Install (README extras set)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest

      # 通路①：裸 console script（README 让用户敲的那条）
      - name: Smoke (console script)
        run: checkup-ledger selftest

      # 通路②：模块形式（sys.path 来源与通路①不同，一种通不等于另一种通）
      - name: Smoke (python -m)
        run: python -m checkup_ledger selftest

      - name: Smoke (indicators + bench)
        run: |
          checkup-ledger indicators
          checkup-ledger bench

      # 可证伪探活：注入缺陷后基准必须报未达标（退出码 1）
      - name: Bench probe must fail as designed
        shell: bash
        run: |
          set +e
          checkup-ledger bench --probe-fault
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "探活失败：--probe-fault 应退出 1（未达标），实得 $code —— 基准可能空转"
            exit 1
          fi
          echo "探活通过：基准确实可证伪（退出码 1）"

      - name: Usage error must exit 2
        shell: bash
        run: |
          set +e
          checkup-ledger no-such-command >/dev/null 2>&1
          code=$?
          if [ "$code" -ne 2 ]; then
            echo "用法错误应退出 2，实得 $code"
            exit 1
          fi
          echo "用法错误退出码正确（2）"

      - name: PII gate selftest
        run: python tools/pii_gate.py --selftest
