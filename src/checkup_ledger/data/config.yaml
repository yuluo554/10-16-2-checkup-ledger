# 运行时配置（随包数据白名单）· schema_version 1
#
# 为什么要有这个文件：**阈值等判定相关数值只能在这里定义一次**。
# 代码里留一个"顺手"的默认值（如 `threshold=0.8`）就成了第二处定义——
# 改配置改不动它，而且静默生效（用户以为在调阈值，实际代码里的字面值赢了）。
# 故 `config.py` 的纪律是：**缺字段即报错，绝不回落**。
#
# ocr_threshold：OCR 行置信度阈值。低于它的行进入待复核队列，
# **未经人工复核确认的行不得进入规范化层**（口径见 data/README.md 第五节第 4 条）。
ocr_threshold: 0.8

schema_version: 1
