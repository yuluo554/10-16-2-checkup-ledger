# 内置区间知识库（随包白名单数据）· schema_version 1
#
# 用途：仅在某行报告**未印参考区间**时作为兜底默认值参与 H/L 机械判定。
# 优先级（口径唯一源 = data/README.md 第五节）：报告自印区间 > 本文件默认值 > 拒判。
#
# 纪律：
#   - 每条必须挂 source.standard（来源分册）与 source.status；
#   - status: pending = 尚未拿到原文逐条核对 → **不进判定路径**（可靠走"拒判"，这是设计内行为）；
#   - status: verified 时 source.evidence 必填（核对渠道 + 日期）；
#   - 区间数值只在本文件定义一次，源码中不得出现第二份（零字面量门禁守）。
#
# 来源分册编号沿用 LabLens（yang-rz-602/lablens）已标注的 WS/T 404/405 分册；
# WS/T 404/405 全文不可直连（卫健委 wsbz 平台 412/502、工标网全文付费），
# 故本文件条目**逐条如实标 pending**，待拿到原文核对后升级 verified。

