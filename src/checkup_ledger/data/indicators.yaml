# 内置区间知识库（随包白名单数据）· schema_version 1
#
# 用途：仅在某行报告**未印参考区间**时作为兜底默认值参与 H/L 机械判定。
# 优先级（口径唯一源 = data/README.md 第五节）：报告自印区间 > 本文件默认值 > 拒判。
#
# 纪律：
#   - 每条必须挂 source.standard（来源分册）与 source.status；
#   - status: pending = 尚未拿到原文逐条核对 → **不进判定路径**（可靠走"拒判"，这是设计内行为）；
#   - status: verified 时 source.evidence 必填（核对渠道 + 日期）；
#   - 区间数值只在本文件定义一次，源码中不得出现第二份（零字面量门禁守）。
#
# ---- M1（2026-10-16）来源核对结论（详见 data/README.md 第六节）----
#   1) 工标网 csres.com 书目页**可直连**（M0 曾记为"不可获取"），据此核对了 WS/T 404/405
#      各分册覆盖的检验项目，并**修正了 M0 的三处分册号张冠李戴**：
#        · WS/T 404.1-2012 只覆盖 ALT/AST/ALP/GGT（M0 曾把 TC/TG/GLU 也挂在 404.1 下）；
#        · 肌酐（CREA）属 WS/T 404.5-**2015**（M0 误记为 2012）；
#        · 血脂（TC/TG/HDL-C/LDL-C）、血糖（GLU）、尿酸（UA）在 WS/T 404/405 系列中
#          **没有对应分册** → 这三类的标准号字段如实标"未定位"，**不以方法标准冒充区间来源**。
#   2) WS/T 全文仍**不可直连**（卫健委 wsbz 412/502、nhc 412；csres 仅书目页、全文付费），
#      故**区间数值本身无法逐条核对** → 全部条目**如实保持 status: pending**。
#      pending 不进判定路径：报告未自印区间时走"拒判"。这是设计内行为（宁拒判，不臆造）。
#   3) 下表数值一律为**常见项默认值**（作者整理，未核对原文），仅作展示与将来核对的目标值；
#      任何情况下以报告单印制的区间与医嘱为准。
#   4) 已知 schema 局限：`canonical_name` 唯一 → 一个项目只能挂一份区间，性别/年龄分层的
#      另一半（如女性 HGB 区间）无处安放。当前按"男性"如实标注 applies_to.sex 而不写 any；
#      分层区间的 schema 扩展留 M3，届时补对侧并加"不该命中"反向用例。

schema_version: 1
